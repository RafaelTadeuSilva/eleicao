allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    def newSubprojectBuildDir = newBuildDir.dir(project.name)
    project.layout.buildDirectory.value(newSubprojectBuildDir)
}
subprojects {
    project.evaluationDependsOn(':app')
}

subprojects { project ->
    def setCompileSdk = {
        if (project.hasProperty('android')) {
            project.android {
                compileSdk = 36
            }
        }
    }
    if (project.state.executed) {
        setCompileSdk()
    } else {
        project.afterEvaluate {
            setCompileSdk()
        }
    }
    tasks.configureEach { task ->
        if (task.class.name.contains("KotlinCompile") && task.hasProperty("incremental")) {
            task.setProperty("incremental", false)
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
